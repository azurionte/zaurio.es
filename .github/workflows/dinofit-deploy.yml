name: Publicar DinoFit
on:
  push:
    branches: [main]
    paths:
      - 'herramientas/dinofit/**'
      - '.github/workflows/dinofit-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dinofit-production
  cancel-in-progress: false

jobs:
  publish:
    name: Build, deploy and verify DinoFit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing test suite
        run: |
          node herramientas/dinofit/tests/rewrite.cjs
      - name: Check deployment credentials without exposing them
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN (Workers Scripts Edit and Zone Read)."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
      - name: Deploy only the DinoFit Worker
        working-directory: herramientas/dinofit
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Verify actual live DinoFit assets
        run: |
          base="https://herramientas.zaurio.es/dinofit"
          check_asset() {
            local route="$1" output="$2" marker="$3" code
            code="$(curl -sSL --max-time 20 -w '%{http_code}' "$base$route" -o "$output" || true)"
            if [ "$code" != "200" ]; then
              echo "::warning::DinoFit $route HTTP $code"
              return 1
            fi
            if ! grep -Fq -- "$marker" "$output"; then
              echo "::warning::DinoFit $route HTTP 200 but missing expected marker: $marker"
              echo "Diagnostic: $route bytes $(wc -c <"$output")"
              if [ "$route" = "/app-pantry.js" ]; then
                echo "Pantry first 180 bytes (public script):"
                head -c 180 "$output" || true
                echo
                echo "Pantry productId occurrences:"
                grep -o -F 'productId' "$output" | wc -l || true
              fi
              return 1
            fi
            echo "PASS $route ($(wc -c <"$output") bytes)"
          }
          for attempt in $(seq 1 8); do
            echo "Checking deployed DinoFit, attempt $attempt/8"
            failed=0
            check_asset "/" /tmp/dino-html 'data-view="pantry"' || failed=1
            check_asset "/app.css" /tmp/dino-css '.pantry-product{' || failed=1
            check_asset "/app.js" /tmp/dino-core 'function normalizeCatalog()' || failed=1
            check_asset "/app-pantry.js" /tmp/dino-pantry 'name="productId"' || failed=1
            check_asset "/app-ui.js" /tmp/dino-ui "activeView==='pantry'?currentPantry()" || failed=1
            check_asset "/app-events.js" /tmp/dino-events 'if(pantryAction(button))return;' || failed=1
            if [ "$failed" -eq 0 ]; then
              echo "PASS: all live pantry assets and frontend integration are available"
              exit 0
            fi
            sleep 4
          done
          echo "::error::DinoFit live verification failed; see the per-asset diagnostics"
          exit 1
