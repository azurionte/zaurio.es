name: Publicar DinoFit
on:
  push:
    branches: [main]
    paths:
      - 'herramientas/dinofit/**'
      - '.github/workflows/dinofit-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dinofit-production
  cancel-in-progress: false

jobs:
  publish:
    name: Build, deploy and verify DinoFit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing test suite
        run: |
          node herramientas/dinofit/tests/rewrite.cjs
      - name: Check deployment credentials without exposing them
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN (Workers Scripts Edit and Zone Read)."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
      - name: Deploy only the DinoFit Worker
        working-directory: herramientas/dinofit
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Verify actual live DinoFit assets
        run: |
          url="https://herramientas.zaurio.es/dinofit/"
          for attempt in $(seq 1 8); do
            echo "Verifying public worker, attempt $attempt/8"
            if curl -fsSL --max-time 20 "$url" -o /tmp/dinofit-live.html \
              && curl -fsSL --max-time 20 "https://herramientas.zaurio.es/dinofit/app.css" -o /tmp/dinofit-live.css \
              && curl -fsSL --max-time 20 "https://herramientas.zaurio.es/dinofit/app.js" -o /tmp/dinofit-live.js \
              && curl -fsSL --max-time 20 "https://herramientas.zaurio.es/dinofit/app-ui.js" -o /tmp/dinofit-live-ui.js \
              && curl -fsSL --max-time 20 "https://herramientas.zaurio.es/dinofit/app-events.js" -o /tmp/dinofit-live-events.js \
              && grep -Fq 'id="calendarBar"' /tmp/dinofit-live.html \
              && grep -Fq 'href="/dinofit/app.css"' /tmp/dinofit-live.html \
              && grep -Fq -- '--bg:#090e1a' /tmp/dinofit-live.css \
              && grep -Fq 'dinofit-chat-import-v1' /tmp/dinofit-live.js \
              && grep -Fq 'function currentDay()' /tmp/dinofit-live-ui.js \
              && grep -Fq 'function openWeightModal(' /tmp/dinofit-live-events.js; then
              echo "PASS: live DinoFit HTML, CSS, scripts and import logic verified"
              exit 0
            fi
            echo "Published page details: $(wc -c </tmp/dinofit-live.html 2>/dev/null || echo 0) bytes"
            sleep 4
          done
          echo "::error::Live DinoFit is not serving all required rewritten assets"
          exit 1
