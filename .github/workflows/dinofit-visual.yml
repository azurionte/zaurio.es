name: DinoFit visual review
on:
  push:
    branches: [fix/dinofit-redesign-clean]
    paths:
      - 'herramientas/dinofit/**'
      - '.github/workflows/dinofit-visual.yml'
  pull_request:
    paths:
      - 'herramientas/dinofit/**'
      - '.github/workflows/dinofit-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser-test tool
        run: npm install --no-save --no-package-lock playwright@1.58.0
      - name: Install Chromium for visual checks
        run: npx playwright install --with-deps chromium
      - name: Test desktop and iPhone layouts
        run: node herramientas/dinofit/tests/visual.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dinofit-visual-check
          path: herramientas/dinofit/tests/visual/*.png
          if-no-files-found: ignore
