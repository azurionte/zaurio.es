name: DZ tests
on: [push, pull_request]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Trivialodon quality patch
        if: github.actor != 'github-actions[bot]'
        run: python _tmp_trivialodon_quality_patch.py
      - run: node --check herramientas/dinerozaurio/finance/accounting-core.js
      - run: node --check herramientas/dinerozaurio/ui/accounts.js
      - run: node --check herramientas/dinerozaurio/folder-mode-summary-v2.js
      - run: node --check herramientas/dinerozaurio/folder-mode-enhancements-v3.js
      - run: node --check herramientas/dinerozaurio/folder-mode-fixes-v4.js
      - run: node --check herramientas/dinerozaurio/ui-fixes-v5.js
      - run: node --check herramientas/dinerozaurio/account-routing-current.js
      - run: node --check herramientas/dinerozaurio/ui/account-observed-adapter.js
      - run: node --check herramientas/dinerozaurio/session-drafts.js
      - run: node herramientas/dinerozaurio/tests/run.js
      - name: Commit Trivialodon patch
        if: github.actor != 'github-actions[bot]' && github.event_name == 'push'
        run: |
          rm -f _tmp_trivialodon_quality_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add juegos.zaurio.es/trivialodon/index.html supabase/functions/trivialodon-generate-question/index.ts _tmp_trivialodon_quality_patch.py
          git diff --cached --quiet && exit 0
          git commit -m "Improve Velociraptor guidance and question quality"
          git push
