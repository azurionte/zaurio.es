name: DZ tests
on: [push, pull_request]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply one-shot Trivialodon Velociraptor patch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 _tmp_trivialodon_velociraptor_patch.py
          rm _tmp_trivialodon_velociraptor_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add juegos.zaurio.es/trivialodon/index.html juegos.zaurio.es/trivialodon/live/index.html _tmp_trivialodon_velociraptor_patch.py
          git commit -m "Enable Velociraptor gameplay in Trivialodon"
          git push
      - run: node --check herramientas/dinerozaurio/finance/accounting-core.js
      - run: node --check herramientas/dinerozaurio/ui/accounts.js
      - run: node --check herramientas/dinerozaurio/folder-mode-summary-v2.js
      - run: node --check herramientas/dinerozaurio/folder-mode-enhancements-v3.js
      - run: node --check herramientas/dinerozaurio/folder-mode-fixes-v4.js
      - run: node --check herramientas/dinerozaurio/ui-fixes-v5.js
      - run: node --check herramientas/dinerozaurio/account-routing-current.js
      - run: node --check herramientas/dinerozaurio/ui/account-observed-adapter.js
      - run: node --check herramientas/dinerozaurio/session-drafts.js
      - run: node herramientas/dinerozaurio/tests/run.js
