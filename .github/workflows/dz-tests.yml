name: DZ tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Legacy safety suite
        run: |
          node --check herramientas/dinerozaurio/finance/accounting-core.js
          node --check herramientas/dinerozaurio/ui/accounts.js
          node --check herramientas/dinerozaurio/folder-mode-summary-v2.js
          node --check herramientas/dinerozaurio/folder-mode-enhancements-v3.js
          node --check herramientas/dinerozaurio/folder-mode-fixes-v4.js
          node --check herramientas/dinerozaurio/ui-fixes-v5.js
          node --check herramientas/dinerozaurio/account-routing-current.js
          node --check herramientas/dinerozaurio/ui/account-observed-adapter.js
          node --check herramientas/dinerozaurio/session-drafts.js
          node herramientas/dinerozaurio/tests/run.js
      - name: DineroZaurio v3 financial core
        run: node herramientas/dinerozaurio/v3/tests/run.js
