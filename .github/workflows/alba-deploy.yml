name: Publish Alba demo
on:
  push:
    branches: [main]
    paths: ['alba/**', '.github/workflows/alba-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zaurio-alba-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            alba
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scope and prepare Alba release
        run: |
          node --input-type=module <<'JS'
          import { mkdirSync, cpSync, writeFileSync, readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const host='zaurio.es', worker='zaurio-alba-demo', dir='.alba-release';
          const patterns=[host+'/alba',host+'/alba/',host+'/alba/*'];
          const paths=['/alba','/alba/classes','/alba/tallers','/alba/contacte'];
          for(const p of paths) assert(readFileSync(p.slice(1)+'/index.html','utf8').includes('<html lang="ca">'));
          assert(process.env.CLOUDFLARE_API_TOKEN && process.env.CLOUDFLARE_ACCOUNT_ID);
          const get=async path=>{
            const r=await fetch('https://api.cloudflare.com/client/v4'+path,{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});
            const j=await r.json(); assert(r.ok&&j.success,'Cloudflare route preflight HTTP '+r.status); return j.result;
          };
          const zones=await get('/zones?name='+host+'&account.id='+process.env.CLOUDFLARE_ACCOUNT_ID);
          assert(zones.length===1&&zones[0].name===host,'Zaurio zone could not be verified');
          for(const r of await get('/zones/'+zones[0].id+'/workers/routes')){
            if(patterns.includes(r.pattern.replace(/^https?:\/\//,''))) assert.equal(r.script,worker,'Alba route has another owner');
          }
          mkdirSync(dir+'/public',{recursive:true});
          cpSync('alba',dir+'/public/alba',{recursive:true});
          writeFileSync(dir+'/wrangler.json',JSON.stringify({
            name:worker,main:'worker.mjs',compatibility_date:'2025-09-27',workers_dev:false,preview_urls:false,
            assets:{directory:'public',binding:'ASSETS',run_worker_first:true,html_handling:'none'},
            routes:patterns.map(pattern=>({pattern,zone_id:zones[0].id}))
          }));
          writeFileSync(dir+'/worker.mjs',`
          export default {async fetch(request,env){
            const url=new URL(request.url);
            if(url.hostname!=='zaurio.es'||!(url.pathname==='/alba'||url.pathname.startsWith('/alba/')))return new Response('Not found',{status:404});
            if(!['GET','HEAD'].includes(request.method))return new Response('Method not allowed',{status:405,headers:{Allow:'GET, HEAD'}});
            if(['/alba','/alba/classes','/alba/tallers','/alba/contacte'].includes(url.pathname.replace(/\\/$/,'')))url.pathname=url.pathname.replace(/\\/$/,'')+'/index.html';
            const response=await env.ASSETS.fetch(new Request(url,request));
            const headers=new Headers(response.headers);
            headers.set('X-Robots-Tag','noindex, nofollow');
            return new Response(response.body,{status:response.status,headers});
          }};
          `);
          JS
          curl -fsSL --max-time 20 https://zaurio.es/ -o .alba-release/root-before
      - name: Deploy only Alba
        run: npx --yes wrangler@4 deploy --config .alba-release/wrangler.json
      - name: Verify production pages, stylesheet, photos and unchanged Zaurio home
        run: |
          check() {
            curl -fsSL --max-time 15 "https://zaurio.es/$1" -o .alba-release/live &&
              cmp "$2" .alba-release/live
          }
          for attempt in $(seq 1 10); do
            if check alba alba/index.html && check alba/ alba/index.html &&
              check alba/classes alba/classes/index.html && check alba/tallers alba/tallers/index.html &&
              check alba/contacte alba/contacte/index.html && check alba/site.css alba/site.css &&
              check alba/media/alba-practica.webp alba/media/alba-practica.webp &&
              check alba/media/alba-retrat.webp alba/media/alba-retrat.webp &&
              check alba/media/alba-bosc.webp alba/media/alba-bosc.webp &&
              check alba/media/estil-ashtanga.webp alba/media/estil-ashtanga.webp &&
              check alba/media/estil-vinyasa.webp alba/media/estil-vinyasa.webp &&
              check alba/media/estil-hatha.webp alba/media/estil-hatha.webp &&
              check alba/media/taller-anti-sofa-editorial.webp alba/media/taller-anti-sofa-editorial.webp &&
              check alba/media/estudi-estores.webp alba/media/estudi-estores.webp &&
              check alba/media/alba-contact-v2.webp alba/media/alba-contact-v2.webp; then
              curl -fsSL --max-time 20 https://zaurio.es/ -o .alba-release/root-after
              cmp .alba-release/root-before .alba-release/root-after
              exit 0
            fi
            sleep 5
          done
          exit 1
