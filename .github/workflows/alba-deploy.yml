name: Publish Alba demo
on:
  push:
    branches: [main]
    paths: ['alba/index.html', '.github/workflows/alba-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zaurio-alba-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify route scope and prepare isolated Worker
        run: |
          node --input-type=module <<'JS'
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const html = readFileSync('alba/index.html', 'utf8');
          assert(html.includes('<html lang="ca">') && html.includes('noindex, nofollow'));
          assert(process.env.CLOUDFLARE_API_TOKEN && process.env.CLOUDFLARE_ACCOUNT_ID, 'Cloudflare deployment credentials are missing');
          const host = 'zaurio.es';
          const worker = 'zaurio-alba-demo';
          const patterns = [host + '/alba', host + '/alba/'];
          const get = async path => {
            const res = await fetch('https://api.cloudflare.com/client/v4'+path, { headers: { Authorization: 'Bearer '+process.env.CLOUDFLARE_API_TOKEN } });
            const body = await res.json();
            assert(res.ok && body.success, 'Cloudflare route preflight HTTP '+res.status);
            return body.result;
          };
          const zones = await get('/zones?name='+host+'&account.id='+process.env.CLOUDFLARE_ACCOUNT_ID);
          assert(zones.length === 1 && zones[0].name === host, 'Could not verify the Zaurio zone');
          const routes = await get('/zones/'+zones[0].id+'/workers/routes');
          for (const route of routes) {
            if (patterns.some(p => p === route.pattern || 'https://'+p === route.pattern || 'http://'+p === route.pattern)) {
              assert.equal(route.script, worker, 'An existing Worker owns an Alba route');
            }
          }
          const dir = '.alba-release';
          mkdirSync(dir, { recursive:true });
          writeFileSync(dir+'/wrangler.json', JSON.stringify({
            name:worker, main:'worker.mjs', compatibility_date:'2025-09-27',
            workers_dev:false, preview_urls:false,
            routes:patterns.map(pattern=>({ pattern, zone_id:zones[0].id })),
          }));
          writeFileSync(dir+'/worker.mjs',
            'const html='+JSON.stringify(html)+';\n'+
            'export default {fetch(request){const url=new URL(request.url);if(url.hostname!=="zaurio.es"||!["/alba","/alba/"].includes(url.pathname))return new Response("Not found",{status:404});if(!["GET","HEAD"].includes(request.method))return new Response("Method not allowed",{status:405,headers:{Allow:"GET, HEAD"}});return new Response(request.method==="HEAD"?null:html,{headers:{"Content-Type":"text/html; charset=utf-8","X-Robots-Tag":"noindex, nofollow","X-Content-Type-Options":"nosniff","Cache-Control":"public, max-age=300"}})}}');
          JS
          curl -fsSL --max-time 15 https://zaurio.es/ -o .alba-release/root-before
      - name: Publish only the Alba demo Worker
        run: npx --yes wrangler@4 deploy --config .alba-release/wrangler.json
      - name: Verify both live paths and unchanged home
        run: |
          for attempt in $(seq 1 10); do
            if curl -fsSL --max-time 15 https://zaurio.es/alba -o .alba-release/live &&
              cmp alba/index.html .alba-release/live &&
              curl -fsSL --max-time 15 https://zaurio.es/alba/ -o .alba-release/live-slash &&
              cmp alba/index.html .alba-release/live-slash; then
              curl -fsSL --max-time 15 https://zaurio.es/ -o .alba-release/root-after
              cmp .alba-release/root-before .alba-release/root-after
              exit 0
            fi
            sleep 5
          done
          exit 1
