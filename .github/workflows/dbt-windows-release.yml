name: Build DBT Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'payslip-desktop/**'
      - '.github/workflows/dbt-windows-release.yml'

permissions:
  contents: write

concurrency:
  group: dbt-windows-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: payslip-desktop/package-lock.json

      - name: Install dependencies
        working-directory: payslip-desktop
        run: npm ci

      - name: Build unsigned Windows installer
        working-directory: payslip-desktop
        run: npm run build:unsigned -- --publish never

      - name: Stage update assets
        shell: pwsh
        run: |
          $package = Get-Content "payslip-desktop/package.json" | ConvertFrom-Json
          $version = $package.version
          $dist = "payslip-desktop/dist"
          $installer = Join-Path $dist "DemoBuildingToolsSetup-$version.exe"
          $blockmap = "$installer.blockmap"
          $latest = Join-Path $dist "latest.yml"

          if (!(Test-Path $installer)) { throw "Installer not found: $installer" }
          if (!(Test-Path $blockmap)) { throw "Blockmap not found: $blockmap" }
          if (!(Test-Path $latest)) { throw "latest.yml not found: $latest" }

          Copy-Item $installer "payslip-updates/" -Force
          Copy-Item $blockmap "payslip-updates/" -Force
          Copy-Item $latest "payslip-updates/latest.yml" -Force

          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  DemoBuildingToolsSetup-$version.exe" | Set-Content "payslip-updates/DemoBuildingToolsSetup-$version.exe.sha256.txt" -NoNewline

          "DBT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DemoBuildingToolsSetup-${{ env.DBT_VERSION }}
          path: |
            payslip-updates/DemoBuildingToolsSetup-${{ env.DBT_VERSION }}.exe
            payslip-updates/DemoBuildingToolsSetup-${{ env.DBT_VERSION }}.exe.blockmap
            payslip-updates/DemoBuildingToolsSetup-${{ env.DBT_VERSION }}.exe.sha256.txt
            payslip-updates/latest.yml
          if-no-files-found: error

      - name: Publish update feed to repository
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "payslip-updates/DemoBuildingToolsSetup-$env:DBT_VERSION.exe"
          git add "payslip-updates/DemoBuildingToolsSetup-$env:DBT_VERSION.exe.blockmap"
          git add "payslip-updates/DemoBuildingToolsSetup-$env:DBT_VERSION.exe.sha256.txt"
          git add "payslip-updates/latest.yml"

          if (git diff --cached --quiet) {
            Write-Host "No release asset changes to publish."
            exit 0
          }

          git commit -m "Publish DBT $env:DBT_VERSION Windows release"
          git push origin HEAD:main
