name: GlobalView Demo Builder checks

on:
  pull_request:
    paths:
      - 'payslip-desktop/mini-apps/Global View/**'
      - 'payslip-updates/apps/Global View/**'
      - 'payslip-updates/apps/gv-demo-builder.json'
      - '.github/workflows/gv-demo-builder-check.yml'
  push:
    branches: [main]
    paths:
      - 'payslip-desktop/mini-apps/Global View/**'
      - 'payslip-updates/apps/Global View/**'
      - 'payslip-updates/apps/gv-demo-builder.json'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate event engine, exports and JavaScript syntax
        run: node "payslip-desktop/mini-apps/Global View/Global View Demo Builder/core.test.js"
      - name: Confirm mini-app package mirrors bundled assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          source = Path('payslip-desktop/mini-apps/Global View/Global View Demo Builder')
          target = Path('payslip-updates/apps/Global View/Global View Demo Builder')
          manifest = json.loads(Path('payslip-updates/apps/gv-demo-builder.json').read_text())
          assert manifest['app'] == 'gv-demo-builder'
          assert manifest['version'] == '0.1.2'
          assert manifest['entry'] == 'Global View/Global View Demo Builder/index.html'
          expected = {'core.js', 'workflow.js', 'app.js', 'guided.js', 'index.html', 'flags/LICENSE.txt'} | {
              'flags/' + code + '.svg' for code in ('au','us','ca','es','mx','gb','cn','de','nl','fr')
          }
          root = Path('Global View/Global View Demo Builder')
          assert {str(Path(item['path']).relative_to(root)) for item in manifest['files']} == expected
          for filename in sorted(expected):
              assert (source / filename).read_bytes() == (target / filename).read_bytes(), filename
              print(filename, 'mirrors bundled source')
          print('GlobalView package verified')
          PY
