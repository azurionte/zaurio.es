  /* Country-first flow: existing DBT typography/palette, fewer visible controls. */
  .country-intro{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:22px}
  .country-intro h2{font-size:25px;margin-bottom:6px}
  .country-board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .country-card{padding:20px;border:1px solid #304158;background:linear-gradient(155deg,#1c293a,#141c2a 75%);border-radius:15px;min-width:0;display:flex;flex-direction:column;gap:15px;text-align:left;color:var(--text);transition:transform .15s ease,border-color .15s ease}
  .country-card:hover,.country-card:focus-visible{border-color:#d65c71;transform:translateY(-2px);outline:none;box-shadow:0 8px 30px #0004}
  .country-card .country-heading{display:flex;align-items:center;gap:13px}
  .country-flag{display:grid;place-items:center;width:44px;height:44px;flex-shrink:0;background:#2a394d;border:1px solid #3d516b;border-radius:12px;font-size:23px}
  .country-card .country-heading strong{font-size:16px;display:block}
  .country-card .country-heading small{color:var(--muted);display:block;margin-top:5px}
  .country-progress{display:grid;gap:11px}
  .country-progress-line{display:grid;gap:6px}
  .country-progress-top{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px}
  .country-progress-top strong{font-size:14px}
  .track{height:7px;background:#354154;border-radius:20px;overflow:hidden;min-width:45px}
  .track > span{height:100%;display:block;background:linear-gradient(90deg,#ec4761,#ff8b89);border-radius:20px}
  .track.import > span{background:linear-gradient(90deg,#529be8,#67cfef)}
  .country-foot{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-top:auto;border-top:1px solid #314158;padding-top:13px}
  .country-foot em{font-size:11px;color:#aebcd1;font-style:normal}
  .country-foot .arrow{font-size:20px;color:#fa8794}
  .journey-hero{display:grid;gap:14px;padding:20px 22px;background:linear-gradient(135deg,#202e41,#131c2a 70%);border:1px solid #354760;border-radius:17px;margin-bottom:16px}
  .journey-hero .journey-heading{display:flex;align-items:center;gap:13px;justify-content:space-between;flex-wrap:wrap}
  .journey-title{display:flex;gap:13px;align-items:center}.journey-title h2{font-size:22px}
  .journey-title p{margin:4px 0 0;color:var(--muted);font-size:12px}
  .journey-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .journey-phase{border:1px solid #374960;border-radius:12px;background:#121d2b88;padding:14px 16px;min-width:0}
  .journey-phase .percent{font-size:23px;font-weight:800;letter-spacing:-.5px}
  .journey-phase .percent small{font-size:12px;font-weight:600;margin-left:3px;color:var(--muted)}
  .journey-phase .flex-between{margin-bottom:8px}
  .journey-phase.active{border-color:#dd6179}
  .journey-phase .track{margin-top:10px}
  .phase-badge{font-size:11px;color:#b1bfd0}
  .journey-tabs{display:flex;gap:7px;flex-wrap:wrap}
  .journey-tab{background:#202d40;border:1px solid #374960;color:#ced9e9;border-radius:9px;padding:10px 15px;font-weight:700;font-size:12px}
  .journey-tab.active{background:#6b263a;border-color:#c2556a;color:#fff}
  .journey-steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin-bottom:16px}
  .journey-step{border:1px solid #34475e;background:#172334;color:#c8d6e7;text-align:left;padding:12px;border-radius:11px;min-width:0}
  .journey-step.active{border-color:#f05e75;background:#352b3b;color:white}
  .journey-step.complete{border-color:#2b7261;background:#183b37}
  .step-number{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:8px;background:#33465e;margin-bottom:9px;font-size:12px;font-weight:800}
  .journey-step.complete .step-number{background:#286b57}
  .journey-step strong{display:block;font-size:12px}.journey-step small{display:block;color:#9faec0;font-size:10px;margin-top:4px}
  .guided-content{display:grid;gap:14px}.guided-intro{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;flex-wrap:wrap}
  .guided-intro h2{font-size:20px}.guided-intro p{margin:5px 0 0;color:var(--muted);max-width:600px;font-size:13px}
  .guided-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px}
  .guided-note{background:#203149;border:1px solid #37506b;border-radius:11px;padding:12px 15px;color:#d2e1ee;font-size:12px;line-height:1.6}
  .insight-stack{display:grid;gap:10px}.insight-item{background:#1c293a;border:1px solid #344860;border-radius:11px;padding:13px}
  .insight-item strong{display:block;font-size:13px}.insight-item small{color:#9fb0c6}
  .flow-row{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:12px;border:1px solid #33475d;background:#182436;border-radius:12px;padding:13px}
  .flow-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#273b51;color:#dceaf7}
  .flow-row strong{font-size:13px}.flow-row p{font-size:11px;color:#9eafc5;margin:4px 0 0}
  .flow-row .btn{font-size:11px}
  .mini-months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:7px}
  .mini-month{border:1px solid #3a4a60;padding:11px 3px;background:#1d2a3d;border-radius:8px;text-align:center;font-size:11px}
  .mini-month strong{display:block;margin-top:5px;font-size:10px;color:#9fb2c8}
  .mini-month.done{background:#16483d;border-color:#36a583}.mini-month.done strong{color:#9fe9c7}
  .mini-month.pending{background:#4c3341;border-color:#a45c6c}
  .mini-month.downloaded{background:#203e56;border-color:#467a9b}
  .mini-month.nodata{opacity:.55}.muted-inline{font-size:12px;color:var(--muted)}
  .shell-footer{margin-top:17px;color:#899bad;font-size:11px}
  .step-ok{display:inline-flex;gap:6px;align-items:center;color:#72e4b2;font-weight:700;font-size:12px}
  .step-warn{display:inline-flex;gap:6px;align-items:center;color:#ffc184;font-weight:700;font-size:12px}
  .goto-back{display:inline-flex;align-items:center;gap:9px;margin-bottom:12px}
  @media(max-width:1100px){.country-board{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:800px){.country-board{grid-template-columns:1fr}.journey-steps{grid-template-columns:repeat(2,minmax(0,1fr))}.journey-stats{grid-template-columns:1fr}.mini-months{grid-template-columns:repeat(6,minmax(0,1fr))}.country-intro h2{font-size:21px}.journey-hero{padding:14px}}


  /* Compact embedded workspace: DBT already owns navigation and updates. */
  #shell{display:block;min-height:100vh}.side{display:none}.main{max-width:1700px;padding:24px clamp(16px,2.8vw,44px) 50px}.top{display:none}
  .country-board{grid-template-columns:repeat(auto-fit,minmax(265px,1fr));gap:14px}
  .country-card{padding:0;overflow:hidden;gap:0;transform:none!important}
  .country-card:hover{box-shadow:0 10px 30px #0004}
  .country-main{background:none;color:inherit;border:0;display:flex;align-items:center;width:100%;text-align:left;gap:12px;padding:20px 18px 13px;cursor:pointer}
  .country-main strong{font-size:16px;display:block}.country-main small{color:var(--muted);display:block;margin-top:5px}
  .country-main .arrow{margin-left:auto;color:var(--muted)}.country-main:hover .arrow{color:#fff}
  .country-flag{border-radius:8px;background:#223044;width:48px;height:39px;overflow:hidden;padding:3px;display:flex;align-items:center;justify-content:center}
  .country-flag img{width:100%;height:100%;object-fit:cover;border-radius:4px;display:block}
  .country-flag .fa-earth-europe{font-size:21px;color:#9fb3cb}
  .mini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:4px 14px 13px}
  .mini-grid button{border:1px solid #34475d;background:#1a2739;padding:12px;border-radius:10px;color:inherit;text-align:left;min-width:0;cursor:pointer}
  .mini-grid button:hover{border-color:#e05b73}.mini-progress{display:grid;gap:7px;font-size:11px}
  .mini-progress strong{font-size:15px;font-weight:750;min-height:20px}.mini-progress .fa-check-circle{color:#69dfad}
  .mini-progress.complete{color:#9ef2d1}.mini-progress.complete .track span{background:#30b98e}
  .mini-progress .track{height:5px}.country-foot{padding:10px 16px;border-top:1px solid #314158;font-size:11px}
  .country-board-foot{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:15px;color:var(--muted);font-size:12px}
