<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>GlobalView Demo Builder · DBT</title>
  <style>
    :root{--bg:#0c121b;--surface:#141d2a;--raised:#1a2535;--muted:#8f9cad;--text:#f1f4fa;--line:#2a3749;--red:#ed3349;--red2:#c62237;--green:#4ce0ad;--blue:#5da3ff;--gold:#ffbe6a;--radius:14px;color-scheme:dark;font-family:Inter,Segoe UI,Arial,sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}a{color:var(--blue)}input,select,textarea{background:#101925;border:1px solid #344257;color:var(--text);border-radius:9px;padding:10px 11px;min-height:39px;min-width:0;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #5da3ff23}input[type=range]{accent-color:var(--red);padding:0;width:100%;background:transparent;min-height:auto;border:0}input[type=checkbox]{accent-color:var(--red);min-height:auto}textarea{resize:vertical}label{display:grid;gap:7px;color:#d2dae4;font-size:12px;font-weight:600}.subtle{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}.mono{font-family:Consolas,monospace}.muted{color:var(--muted)}.accent{color:var(--red)}.ok{color:var(--green)}.warn{color:var(--gold)}.err{color:#ff7383}
    #shell{display:grid;grid-template-columns:225px minmax(0,1fr);min-height:100vh}.side{position:sticky;top:0;height:100vh;overflow:auto;background:#111927;border-right:1px solid var(--line);padding:20px 13px;display:flex;flex-direction:column;gap:15px}.brand{display:flex;gap:11px;align-items:center;padding:2px 7px 11px}.mark{width:43px;height:43px;background:linear-gradient(135deg,#f54d5e,#a4142a);border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:16px;box-shadow:0 9px 30px #e12b4a33}.brand strong{font-size:17px;letter-spacing:-.4px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.8px}.side-section{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:#788da8;margin:14px 10px 3px}.nav{display:grid;gap:4px}.nav-btn{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:12px 13px;border:1px solid transparent;border-radius:10px;color:#b7c4d5;background:none}.nav-btn svg{width:17px;height:17px}.nav-btn:hover,.nav-btn.active{background:#263249;color:white}.nav-btn.active{border-color:#40516a;box-shadow:inset 3px 0 var(--red)}.nav-btn span{font-size:13px}.side-foot{margin-top:auto;background:#182334;border:1px solid #2b3d52;border-radius:12px;padding:13px}.side-foot b{font-size:12px}.side-foot p{margin:6px 0;color:var(--muted);font-size:11px;line-height:1.5}.main{min-width:0;max-width:1650px;padding:25px clamp(17px,3.6vw,56px) 60px;margin:0 auto;width:100%}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:24px;flex-wrap:wrap}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:2.3px;font-weight:800;color:var(--red);margin-bottom:7px}h1{font-size:clamp(25px,3vw,36px);letter-spacing:-1.2px;margin:0 0 6px}h2{font-size:19px;letter-spacing:-.5px;margin:0}h3{font-size:15px;margin:0}p{line-height:1.55}.top-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.btn{border-radius:9px;border:1px solid #40516b;padding:10px 15px;background:#223046;color:#fff;font-weight:700;font-size:12px;transition:background .12s,border-color .12s;white-space:nowrap}.btn:hover{background:#30425d}.btn.primary{background:var(--red);border-color:var(--red);color:white}.btn.primary:hover{background:var(--red2)}.btn.ghost{background:transparent;border-color:#40516b;color:#cad7e5}.btn.danger{background:#5b2030;border-color:#853044;color:#ffccd3}.btn.small{font-size:11px;padding:7px 10px}.btn.success{border-color:#236b59;background:#154e41;color:#d2ffed}.btn + .btn{margin-left:0}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;min-width:0}.card.soft{background:#171f2c}.card + .card{margin-top:13px}.pane-title{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:17px;flex-wrap:wrap}.pane-title p{margin:5px 0 0;font-size:12px;color:var(--muted)}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}.kpi{padding:19px;border-radius:13px;background:var(--surface);border:1px solid var(--line)}.kpi .metric{font-size:29px;letter-spacing:-1px;font-weight:800;font-variant-numeric:tabular-nums;margin:6px 0}.kpi .hint{font-size:11px;color:var(--muted)}.kpi .kicon{width:31px;height:31px;border-radius:9px;background:#28364a;display:grid;place-items:center;font-size:15px}.section{display:grid;gap:15px;margin-top:15px}.pill{border-radius:100px;padding:5px 10px;background:#283448;color:#ccd9e8;font-size:11px;font-weight:700;white-space:nowrap}.pill.good{background:#15463b;color:#83edc4}.pill.warn{background:#573e26;color:#ffd19a}.pill.bad{background:#5e2c33;color:#ffb3bf}.divider{border-top:1px solid var(--line);margin:16px 0}.empty{text-align:center;border:1px dashed #49607a;border-radius:13px;padding:45px 22px;color:#a2afc2}.empty strong{display:block;color:white;margin-bottom:8px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.control-row{display:flex;gap:9px;align-items:end;flex-wrap:wrap}.control-row > label{min-width:125px;flex:1}.control-row > .btn{margin-bottom:0}.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:15px}.filters label{min-width:145px}.summary-strip{display:flex;gap:10px;flex-wrap:wrap}.summary-strip .pill{font-weight:500}
    .bars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));align-items:end;gap:8px;min-height:238px;padding-top:12px}.bar-btn{background:transparent;border:0;min-width:0;display:flex;align-items:center;flex-direction:column;justify-content:end;height:216px;gap:8px;color:var(--muted)}.bar-btn:hover .bar-stack,.bar-btn.selected .bar-stack{outline:2px solid #a0bbeb;outline-offset:3px}.bar-frame{width:100%;max-width:52px;height:172px;display:flex;flex-direction:column;justify-content:end}.bar-stack{display:flex;flex-direction:column-reverse;overflow:hidden;min-height:4px;width:100%;border-radius:6px 6px 3px 3px;background:#263144}.bar-piece{width:100%}.bar-btn small{font-size:11px}.bar-btn b{color:#d6dfeb;font-size:10px}.legend{display:flex;gap:18px;flex-wrap:wrap}.dot{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:7px}
    .heatmap{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:7px}.heatcell{background:#223049;border-radius:10px;padding:12px 4px;text-align:center;border:1px solid #314157;color:#e7f0fc}.heatcell strong{display:block;font-size:16px}.heatcell small{font-size:10px;color:#a9b6c8}.heatcell.high{border-color:#bf6170;background:#613142}.heatcell.low{border-color:#46677a;background:#1b3444}
    .rule-list{display:grid;gap:8px}.rule-line{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid #334359;border-radius:10px;background:#182335;text-align:left;color:white;width:100%}.rule-line:hover,.rule-line.selected{border-color:#d24d65;background:#283146}.rule-line .tag{border-radius:8px;background:#334157;font-size:10px;padding:4px 6px;color:#d5e3f4}.rule-line span{flex:1}.rule-line small{display:block;color:#9daec2;margin-top:4px}.rule-line strong{font-size:12px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.formgrid .wide{grid-column:1/-1}.months-edit{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.weightcell{background:#101925;padding:10px;border:1px solid #304153;border-radius:9px;text-align:center}.weightcell b{display:block;font-size:12px}.weightcell label{font-size:10px;color:var(--muted);display:block}.monthweight{font-size:16px;color:#f6cad0;font-weight:800}.period-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}.month-check{border:1px solid #34465f;background:#1c2b40;color:#d0dff2;border-radius:9px;padding:11px 3px;font-size:11px;font-weight:800}.month-check.active{background:#a42c43;border-color:#ee6073;color:#fff}.tablewrap{overflow:auto;border:1px solid #304054;border-radius:11px}.data{border-collapse:collapse;width:100%;min-width:750px}.data th{background:#1a2639;color:#9daec3;font-size:10px;letter-spacing:.5px;text-transform:uppercase;font-weight:700;text-align:left;padding:13px 12px;position:sticky;top:0}.data td{border-top:1px solid #2c3a4d;padding:11px 12px;font-size:12px;color:#d9e3ef}.data tr:hover td{background:#1e2b3b}.data tr{cursor:pointer}.data .rowbtn{padding:4px 8px;border:1px solid #425a75;border-radius:7px;color:#e2eaf4;background:#27384b}.table-footer{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap}.progress-list{display:grid;gap:8px}.progress-row{display:grid;grid-template-columns:75px 1fr auto;align-items:center;gap:12px;border:1px solid #304056;border-radius:10px;padding:10px 13px}.barline{height:7px;border-radius:9px;background:#2b3a50;overflow:hidden}.barline div{height:100%;border-radius:9px;background:linear-gradient(90deg,#ed3349,#ff8690)}.checkitem{display:flex;align-items:center;gap:8px;color:#cdd8e8}.checkitem input{margin:0}.eventedit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-height:50vh;overflow:auto}.eventedit label{min-width:0}.tip{padding:12px 15px;border-left:3px solid #7ca8e3;background:#1b2e44;border-radius:7px;font-size:12px;line-height:1.6;color:#c5d5e7}.tip.warning{background:#382d2a;border-color:#e6a55b;color:#f9d8af}.tip.danger{background:#492733;border-color:#eb6d78;color:#ffccd1}.alertbar{margin-bottom:14px}.audit-item{padding:12px 0;border-bottom:1px solid #29384b;display:flex;gap:11px;align-items:start}.audit-item:last-child{border-bottom:0}.audit-item time{color:var(--muted);font-size:11px}.audit-item p{margin:4px 0 0;font-size:12px;color:#d5deea}.modal-layer{position:fixed;inset:0;background:#07101bdc;z-index:100;display:flex;align-items:center;justify-content:center;padding:14px}.modal{width:min(660px,100%);max-height:90vh;overflow:auto;border-radius:18px;border:1px solid #53667f;background:#172236;box-shadow:0 18px 75px #0009;padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-head h2{margin:0}.modal-foot{margin-top:20px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.close{border:0;background:transparent;color:#cbd9e8;font-size:24px}.toast{position:fixed;bottom:22px;right:20px;z-index:200;border:1px solid #516179;background:#233349;border-radius:11px;padding:13px 17px;box-shadow:0 12px 40px #0009;max-width:360px;line-height:1.5}.toc{display:grid;gap:8px}.toc .rule-line{padding:10px}.form-card{padding:14px;border:1px solid #33435a;border-radius:10px}.flex-between{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap}.eTag{font-size:10px;color:#aac6e0;border:1px solid #44617c;padding:3px 7px;border-radius:5px}
    @media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g5{grid-template-columns:repeat(3,minmax(0,1fr))}.months-edit{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media(max-width:800px){#shell{grid-template-columns:1fr}.side{position:static;height:auto;padding:10px;gap:8px}.brand{padding:2px 6px}.nav{display:flex;overflow:auto}.side-section,.side-foot{display:none}.nav-btn{width:auto;white-space:nowrap;padding:9px 11px}.main{padding:18px 12px 45px}.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.heatmap{grid-template-columns:repeat(6,minmax(0,1fr))}.bars{gap:3px}.bar-btn{height:185px}.bar-frame{height:145px}.bar-btn small{font-size:9px}.formgrid{grid-template-columns:1fr}.months-edit{grid-template-columns:repeat(3,minmax(0,1fr))}.period-grid{grid-template-columns:repeat(6,minmax(0,1fr))}.eventedit{grid-template-columns:1fr}.modal{padding:16px}}
  </style>
</head>
<body>
<div id="shell">
  <aside class="side">
    <div class="brand"><div class="mark">GV</div><div><strong>GlobalView</strong><small>DEMO BUILDER · 0.1</small></div></div>
    <div class="side-section">Workspace</div>
    <nav class="nav" aria-label="GlobalView Builder navigation">
      <button type="button" class="nav-btn active" data-page="overview"><span>◈</span><span>Overview</span></button>
      <button type="button" class="nav-btn" data-page="planner"><span>▦</span><span>Event planner</span></button>
      <button type="button" class="nav-btn" data-page="employees"><span>♙</span><span>Employees & events</span></button>
      <button type="button" class="nav-btn" data-page="exports"><span>⇩</span><span>Export center</span></button>
      <button type="button" class="nav-btn" data-page="countries"><span>⚙</span><span>Country setup</span></button>
      <button type="button" class="nav-btn" data-page="activity"><span>◷</span><span>Activity & notes</span></button>
    </nav>
    <div class="side-foot"><b>Keep your work safe</b><p>Projects are saved on this device. Share a snapshot to continue working on another approved workstation.</p></div>
  </aside>
  <main class="main">
    <header class="top">
      <div><div class="eyebrow" id="page-eyebrow">Demo Building Tools / GlobalView</div><h1 id="page-title">Overview</h1><div class="muted small" id="page-subtitle">Annual employee event planning and export</div></div>
      <div class="top-actions">
        <select aria-label="Current project" id="projectSelect"><option value="">No project selected</option></select>
        <button class="btn ghost" id="shareBtn" type="button" title="Export project snapshot for another analyst">Share snapshot</button>
        <button class="btn primary" id="newBtn" type="button">+ New project</button>
      </div>
    </header>
    <div id="notices"></div>
    <div id="content"></div>
  </main>
</div>
<input type="file" id="importFiles" accept=".txt,text/plain" multiple hidden>
<input type="file" id="importSnapshot" accept=".json,application/json" hidden>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
